<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Log In | AI Mock Interview</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f8f7fc;
            color: #171717;
        }

        /* ================= NAVBAR ================= */

        nav {
            height: 76px;
            background: white;
            border-bottom: 1px solid #ededed;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 21px;
            font-weight: 800;
        }

        .logo-icon {
            width: 38px;
            height: 38px;

            border-radius: 11px;

            background: linear-gradient(
                135deg,
                #7357ff,
                #9a72ff
            );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 16px;
        }

        .back-home {
            text-decoration: none;
            color: #7357ff;

            font-size: 14px;
            font-weight: 700;
        }

        .back-home:hover {
            color: #523bc7;
        }

        /* ================= PAGE ================= */

        .page {
            min-height: calc(100vh - 76px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 45px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 440px;

            background: white;

            border: 1px solid #e7e3f1;

            border-radius: 18px;

            padding: 40px;

            box-shadow:
                0 18px 55px rgba(55, 40, 110, 0.08);
        }

        .badge {
            display: inline-block;

            background: #eeeaff;
            color: #7357ff;

            border: 1px solid #ddd5ff;

            padding: 7px 13px;

            border-radius: 30px;

            font-size: 11px;
            font-weight: 800;

            margin-bottom: 17px;
        }

        h1 {
            font-size: 32px;

            letter-spacing: -1px;

            margin-bottom: 10px;
        }

        .subtitle {
            color: #707070;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;
        }

        /* ================= MESSAGE ================= */

        .message {
            display: none;

            padding: 11px 13px;

            border-radius: 8px;

            margin-bottom: 17px;

            font-size: 12px;

            line-height: 1.5;
        }

        .message.error {
            display: block;

            background: #fff0f0;

            color: #b42323;

            border: 1px solid #ffd2d2;
        }

        .message.success {
            display: block;

            background: #effcf4;

            color: #167342;

            border: 1px solid #c9efd9;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;

            border: 1px solid #ddd9e6;

            background: white;

            border-radius: 9px;

            padding: 13px 14px;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #7357ff;

            box-shadow:
                0 0 0 3px rgba(115, 87, 255, 0.08);
        }

        /* ================= LOGIN BUTTON ================= */

        .login-button {
            width: 100%;

            border: none;

            background: #171717;

            color: white;

            padding: 14px;

            border-radius: 9px;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.2s;
        }

        .login-button:hover:not(:disabled) {
            background: #7357ff;
        }

        .login-button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        /* ================= SIGNUP ================= */

        .signup-text {
            text-align: center;

            margin-top: 24px;

            color: #707070;

            font-size: 13px;
        }

        .signup-text a {
            color: #7357ff;

            font-weight: 800;

            text-decoration: none;
        }

        .signup-text a:hover {
            text-decoration: underline;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 600px) {

            nav {
                padding: 0 5%;
            }

            .login-card {
                padding: 28px 22px;
            }

            h1 {
                font-size: 28px;
            }
        }

    </style>
</head>

<body>


<!-- ================= NAVBAR ================= -->

<nav>

    <div class="logo">

        <div class="logo-icon">
            AI
        </div>

        <span>
            MockInterview
        </span>

    </div>


    <a
        href="index.html"
        class="back-home"
    >
        ← Back to Home
    </a>

</nav>


<!-- ================= LOGIN ================= -->

<main class="page">

    <div class="login-card">

        <div class="badge">
            B.TECH INTERVIEW PRACTICE
        </div>


        <h1>
            Welcome back
        </h1>


        <p class="subtitle">
            Log in to continue your interview practice
            and access your interview history.
        </p>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- FORM -->

        <form
            id="loginForm"
            onsubmit="loginUser(event)"
        >

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-button"
                id="loginButton"
            >
                Log In →
            </button>

        </form>


        <div class="signup-text">

            Don't have an account?

            <a href="signup.html">
                Create an Account
            </a>

        </div>

    </div>

</main>


<script>

    async function loginUser(event) {

        event.preventDefault();


        const email =
            document.getElementById("email")
                .value
                .trim();

        const password =
            document.getElementById("password")
                .value;


        const message =
            document.getElementById("message");

        const button =
            document.getElementById("loginButton");


        /* Clear previous message */

        message.className = "message";

        message.textContent = "";


        /* Disable button */

        button.disabled = true;

        button.textContent =
            "Logging In...";


        try {

            const response =
                await fetch("php/login.php", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        email: email,

                        password: password

                    })

                });


            const data =
                await response.json();


            if (data.success) {

                message.className =
                    "message success";

                message.textContent =
                    data.message;


                /*
                    After login, go back to the
                    role-selection page.

                    Later we will improve this so
                    Start Practice can return the
                    user to exactly where they were.
                */

                setTimeout(function() {

                    window.location.href =
                        "role-based.html";

                }, 800);


            } else {

                message.className =
                    "message error";

                message.textContent =
                    data.message;

                button.disabled = false;

                button.textContent =
                    "Log In →";
            }


        } catch (error) {

            message.className =
                "message error";

            message.textContent =
                "Unable to connect to the server. Make sure Apache and MySQL are running.";

            button.disabled = false;

            button.textContent =
                "Log In →";

        }

    }

</script>


</body>
</html>
