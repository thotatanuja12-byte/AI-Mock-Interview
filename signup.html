<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | AI Mock Interview</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f8f7fc;
            color: #171717;
        }

        /* ================= NAVBAR ================= */

        nav {
            height: 76px;
            background: white;
            border-bottom: 1px solid #ededed;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;

            font-size: 21px;
            font-weight: 800;
        }

        .logo-icon {
            width: 38px;
            height: 38px;

            border-radius: 11px;

            background: linear-gradient(
                135deg,
                #7357ff,
                #9a72ff
            );

            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 16px;
        }

        .back-home {
            text-decoration: none;
            color: #7357ff;

            font-size: 14px;
            font-weight: 700;
        }

        .back-home:hover {
            color: #523bc7;
        }

        /* ================= PAGE ================= */

        .page {
            min-height: calc(100vh - 76px);

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 45px 20px;
        }

        .signup-card {
            width: 100%;
            max-width: 470px;

            background: white;

            border: 1px solid #e7e3f1;

            border-radius: 18px;

            padding: 38px;

            box-shadow:
                0 18px 55px rgba(55, 40, 110, 0.08);
        }

        .badge {
            display: inline-block;

            background: #eeeaff;
            color: #7357ff;

            border: 1px solid #ddd5ff;

            padding: 7px 13px;

            border-radius: 30px;

            font-size: 11px;
            font-weight: 800;

            margin-bottom: 17px;
        }

        h1 {
            font-size: 32px;

            letter-spacing: -1px;

            margin-bottom: 10px;
        }

        .subtitle {
            color: #707070;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 28px;
        }

        /* ================= FORM ================= */

        .form-group {
            margin-bottom: 19px;
        }

        .form-group label {
            display: block;

            font-size: 13px;

            font-weight: 700;

            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;

            border: 1px solid #ddd9e6;

            background: white;

            border-radius: 9px;

            padding: 13px 14px;

            font-size: 14px;

            outline: none;

            transition: 0.2s;
        }

        .form-group input:focus {
            border-color: #7357ff;

            box-shadow:
                0 0 0 3px rgba(115, 87, 255, 0.08);
        }

        .password-note {
            color: #898989;

            font-size: 11px;

            margin-top: 7px;
        }

        /* ================= TERMS ================= */

        .terms {
            display: flex;

            align-items: flex-start;

            gap: 9px;

            margin: 22px 0;
        }

        .terms input {
            margin-top: 2px;

            accent-color: #7357ff;
        }

        .terms label {
            color: #707070;

            font-size: 11px;

            line-height: 1.5;
        }

        /* ================= BUTTON ================= */

        .signup-button {
            width: 100%;

            border: none;

            background: #171717;

            color: white;

            padding: 14px;

            border-radius: 9px;

            font-size: 14px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.2s;
        }

        .signup-button:hover {
            background: #7357ff;
        }

        /* ================= MESSAGE ================= */

        .message {
            display: none;

            padding: 11px 13px;

            border-radius: 8px;

            margin-bottom: 17px;

            font-size: 12px;

            line-height: 1.5;
        }

        .message.error {
            display: block;

            background: #fff0f0;

            color: #b42323;

            border: 1px solid #ffd2d2;
        }

        .message.success {
            display: block;

            background: #effcf4;

            color: #167342;

            border: 1px solid #c9efd9;
        }

        /* ================= LOGIN ================= */

        .login-text {
            text-align: center;

            margin-top: 23px;

            color: #707070;

            font-size: 13px;
        }

        .login-text a {
            color: #7357ff;

            font-weight: 800;

            text-decoration: none;
        }

        .login-text a:hover {
            text-decoration: underline;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 600px) {

            nav {
                padding: 0 5%;
            }

            .back-home {
                font-size: 12px;
            }

            .signup-card {
                padding: 27px 21px;
            }

            h1 {
                font-size: 28px;
            }
        }

    </style>
</head>

<body>

<!-- ================= NAVBAR ================= -->

<nav>

    <div class="logo">

        <div class="logo-icon">
            AI
        </div>

        <span>
            MockInterview
        </span>

    </div>

    <a
        href="index.html"
        class="back-home"
    >
        ← Back to Home
    </a>

</nav>


<!-- ================= SIGNUP ================= -->

<main class="page">

    <div class="signup-card">

        <div class="badge">
            B.TECH INTERVIEW PRACTICE
        </div>

        <h1>
            Create your account
        </h1>

        <p class="subtitle">
            Create an account to save your interviews,
            scores and performance history.
        </p>


        <!-- MESSAGE -->

        <div
            id="message"
            class="message"
        ></div>


        <!-- FORM -->

        <form
            id="signupForm"
            onsubmit="createAccount(event)"
        >

            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

                <div class="password-note">
                    Password must contain at least 6 characters.
                </div>

            </div>


            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Re-enter your password"
                    minlength="6"
                    required
                >

            </div>


            <div class="terms">

                <input
                    type="checkbox"
                    id="terms"
                    required
                >

                <label for="terms">
                    I agree to create an account and allow the
                    platform to store my interview practice data,
                    scores and interview history.
                </label>

            </div>


            <button
                type="submit"
                class="signup-button"
                id="signupButton"
            >
                Create Account →
            </button>

        </form>


        <div class="login-text">

            Already have an account?

            <a href="login.html">
                Log In
            </a>

        </div>

    </div>

</main>


<script>

    async function createAccount(event) {

        event.preventDefault();


        const name =
            document.getElementById("name").value.trim();

        const email =
            document.getElementById("email").value.trim();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        const message =
            document.getElementById("message");

        const button =
            document.getElementById("signupButton");


        /* Clear old message */

        message.className = "message";

        message.textContent = "";


        /* Password check */

        if (password !== confirmPassword) {

            message.className =
                "message error";

            message.textContent =
                "Passwords do not match.";

            return;
        }


        if (password.length < 6) {

            message.className =
                "message error";

            message.textContent =
                "Password must contain at least 6 characters.";

            return;
        }


        /* Disable button */

        button.disabled = true;

        button.textContent =
            "Creating Account...";


        try {

            const response =
                await fetch("php/signup.php", {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        name: name,
                        email: email,
                        password: password
                    })

                });


            const data =
                await response.json();


            if (data.success) {

                message.className =
                    "message success";

                message.textContent =
                    data.message;


                /*
                    Automatically go to login
                    after successful registration.
                */

                setTimeout(function() {

                    window.location.href =
                        "login.html";

                }, 1200);


            } else {

                message.className =
                    "message error";

                message.textContent =
                    data.message;

                button.disabled = false;

                button.textContent =
                    "Create Account →";
            }


        } catch (error) {

            message.className =
                "message error";

            message.textContent =
                "Unable to connect to the server. Please make sure Apache and MySQL are running.";

            button.disabled = false;

            button.textContent =
                "Create Account →";

        }

    }

</script>

</body>
</html>
